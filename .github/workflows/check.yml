name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Verify release fingerprint
        run: python -c "import json,pathlib,hashlib; p=pathlib.Path('.'); v=json.loads((p/'package.json').read_text())['version']; r=json.loads((p/f'docs/validation-{v}.json').read_text()); assert hashlib.sha256((p/f'dist/zotero-centers-{v}.xpi').read_bytes()).hexdigest()==r['artifact']['sha256']"
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-centers
          path: dist/*
